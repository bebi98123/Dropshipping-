<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tepore</title>
  <meta name="description" content="Tepore">
  <meta name="theme-color" content="#17120f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-chrome-top></div>

  <main id="pdpRoot">
    <div class="container">
      <nav class="breadcrumb" data-i18n-attr="aria-label:a11y.breadcrumb"><a href="index.html" data-i18n="pdp.home"></a> / <a href="index.html#prodotti" data-i18n="pdp.products"></a> / <span id="bcName"></span></nav>

      <div class="pdp">
        <div class="gallery">
          <div class="gallery-main" id="galleryMain"></div>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
        </div>

        <div class="pdp-info" id="pdpInfo"></div>
      </div>
    </div>

    <section class="section" style="padding-bottom:0">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="pdp.hlEyebrow"></span>
          <h2 data-i18n="pdp.hlTitle"></h2>
        </div>
        <div class="highlights benefits" id="highlights"></div>
      </div>
    </section>

    <section class="section section-dark grain" style="margin-top:clamp(72px,9vw,130px)">
      <div class="container story" id="story"></div>
    </section>

    <section class="section section-cream" id="recensioni">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="reviews.eyebrow"></span>
          <h2 data-i18n="pdp.revTitle"></h2>
          <div class="reviews-summary" id="pdpReviewSum"></div>
        </div>
        <div class="reviews-grid" id="pdpReviews"></div>
        <p class="sample-note" id="sampleNote" hidden data-i18n="review.sampleNote"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="pdp.crossEyebrow"></span>
          <h2 data-i18n="pdp.crossTitle"></h2>
        </div>
        <div class="product-grid" id="crossSell" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"></div>
      </div>
    </section>

    <section class="section section-cream" id="faq">
      <div class="container faq-wrap">
        <div class="section-head left reveal">
          <span class="eyebrow" data-i18n="pdp.faqEyebrow"></span>
          <h2 data-i18n="pdp.faqTitle"></h2>
          <p data-i18n="pdp.faqLead"></p>
        </div>
        <div id="faqList"></div>
      </div>
    </section>
  </main>

  <div class="sticky-atc" id="stickyAtc"></div>

  <div data-chrome-bottom></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n/it.js"></script>
  <script src="assets/js/i18n/en.js"></script>
  <script src="assets/js/i18n/de.js"></script>
  <script src="assets/js/i18n/fr.js"></script>
  <script src="assets/js/i18n/es.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="meta.checkoutTitle">Checkout | Tepore</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17120f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background:#fff">
  <header class="checkout-header">
    <div class="container">
      <a href="index.html" class="logo" id="coLogo"><span>tepore</span></a>
      <div class="header-actions">
        <span class="secure"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> <span data-i18n="co.secure"></span></span>
        <span id="coLang"></span>
      </div>
    </div>
  </header>

  <div class="checkout">
    <div class="co-main">
      <div>
        <form id="coForm" novalidate>
          <div class="co-steps" data-i18n="co.steps"></div>

          <div class="co-block">
            <h3 data-i18n="co.express"></h3>
            <div class="express">
              <button type="button" class="ex-apple" data-express>Apple Pay</button>
              <button type="button" class="ex-pp" data-express>PayPal</button>
              <button type="button" class="ex-gp" data-express><span><b style="color:#4285f4">G</b> Pay</span></button>
            </div>
            <p id="expressMsg" hidden style="font-size:13.5px;color:var(--muted);margin-top:10px" data-i18n="co.expressMsg"></p>
          </div>
          <div class="divider" data-i18n="co.or"></div>

          <div class="co-block">
            <h3 data-i18n="co.contact"></h3>
            <div class="fields">
              <div class="field full"><input type="email" id="email" name="email" placeholder=" " required autocomplete="email"><label for="email" data-i18n="co.email"></label></div>
            </div>
            <label class="check"><input type="checkbox" id="news" name="news" checked> <span data-i18n="co.news"></span></label>
          </div>

          <div class="co-block">
            <h3 data-i18n="co.delivery"></h3>
            <div class="fields">
              <div class="field full">
                <select id="country" name="country" autocomplete="country"></select>
                <label for="country" data-i18n="co.country"></label>
              </div>
              <div class="field"><input id="fname" name="fname" placeholder=" " required autocomplete="given-name"><label for="fname" data-i18n="co.fname"></label></div>
              <div class="field"><input id="lname" name="lname" placeholder=" " required autocomplete="family-name"><label for="lname" data-i18n="co.lname"></label></div>
              <div class="field full"><input id="address" name="address" placeholder=" " required autocomplete="address-line1"><label for="address" data-i18n="co.address"></label></div>
              <div class="field full"><input id="address2" name="address2" placeholder=" " autocomplete="address-line2"><label for="address2" data-i18n="co.address2"></label></div>
              <div class="field"><input id="zip" name="zip" placeholder=" " required autocomplete="postal-code"><label for="zip" data-i18n="co.zip"></label></div>
              <div class="field"><input id="city" name="city" placeholder=" " required autocomplete="address-level2"><label for="city" data-i18n="co.city"></label></div>
              <div class="field"><input id="prov" name="prov" placeholder=" " autocomplete="address-level1"><label for="prov" data-i18n="co.prov"></label></div>
              <div class="field"><input id="phone" name="phone" type="tel" placeholder=" " required autocomplete="tel"><label for="phone" data-i18n="co.phone"></label></div>
            </div>
          </div>

          <div class="co-block">
            <h3 data-i18n="co.method"></h3>
            <div class="pay-options" id="shipOptions"></div>
          </div>

          <div class="co-block">
            <h3 data-i18n="co.payment"></h3>
            <p style="font-size:14px;color:var(--muted);margin-bottom:12px" data-i18n="co.payNote"></p>
            <div class="pay-options">
              <label class="pay-opt"><input type="radio" name="pay" value="card" checked> <span data-i18n="co.card"></span> <span class="payments"><span class="pay visa" style="border:1px solid var(--line)">VISA</span><span class="pay mc" style="border:1px solid var(--line)"><span><i></i><i></i></span></span></span></label>
              <label class="pay-opt"><input type="radio" name="pay" value="paypal"> <span data-i18n="co.paypal"></span> <span class="payments"><span class="pay pp" style="border:1px solid var(--line)">Pay<em>Pal</em></span></span></label>
              <label class="pay-opt"><input type="radio" name="pay" value="klarna"> <span data-i18n="co.klarna"></span> <span class="payments"><span class="pay klarna">Klarna.</span></span></label>
            </div>
            <p style="font-size:13px;color:var(--muted);margin-top:10px" data-i18n="co.redirect"></p>
            <label class="check"><input type="checkbox" name="terms" id="terms" required> <span data-i18n="co.terms"></span></label>
          </div>

          <button class="btn btn-primary btn-block" style="--bh:62px;font-size:17px" type="submit" id="payBtn"></button>
          <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:14px" data-i18n="co.binding"></p>
        </form>

        <div class="co-done" id="coDone">
          <div class="big-check"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
          <h2 id="doneTitle"></h2>
          <p id="doneText"></p>
          <a href="index.html" class="btn btn-dark" data-i18n="co.back"></a>
        </div>
      </div>
    </div>

    <aside class="co-side">
      <div>
        <details open id="summaryDetails">
          <summary class="co-mobile-summary"><span><span data-i18n="co.summary"></span> ▾</span><span id="mTotal"></span></summary>
          <div class="co-side-body">
            <div id="coLines"></div>
            <form class="code-form" id="coCode" style="margin:20px 0 6px"><input name="code" id="coCodeInput" data-i18n-attr="placeholder:a11y.discountCode;aria-label:a11y.discountCode"><button class="btn btn-dark btn-sm" type="submit" data-i18n="cart.apply"></button></form>
            <div class="code-msg" id="coCodeMsg"></div>
            <div class="co-sums" id="coSums"></div>
            <div class="co-assurance" id="coAssure"></div>
          </div>
        </details>
      </div>
    </aside>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n/it.js"></script>
  <script src="assets/js/i18n/en.js"></script>
  <script src="assets/js/i18n/de.js"></script>
  <script src="assets/js/i18n/fr.js"></script>
  <script src="assets/js/i18n/es.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>

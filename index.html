<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="meta.homeTitle">Tepore — Il calore che ti segue, stanza dopo stanza</title>
  <meta name="description" data-i18n-attr="content:meta.homeDesc" content="Tappetino bagno riscaldato, pantofole riscaldate USB e scaldatazza smart.">
  <meta name="theme-color" content="#17120f">
  <meta property="og:title" content="Tepore">
  <meta property="og:image" content="assets/img/mat.jpg">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-chrome-top></div>

  <main>
    <!-- HERO -->
    <section class="hero grain">
      <div class="container">
        <div class="hero-copy">
          <span class="hero-eyebrow reveal"><span class="pill" data-i18n="hero.pill"></span> <span data-i18n="hero.eyebrow"></span></span>
          <h1 class="reveal reveal-d1" data-i18n="hero.title"></h1>
          <p class="hero-lead reveal reveal-d2" data-i18n="hero.lead"></p>
          <div class="hero-cta reveal reveal-d3">
            <a href="#prodotti" class="btn btn-primary"><span data-i18n="hero.cta"></span> <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
            <a href="#kit" class="btn btn-ghost" data-i18n="hero.cta2"></a>
          </div>
          <div class="hero-proof reveal reveal-d3">
            <div class="avatars" aria-hidden="true">
              <span style="background:#ffcf86">G</span><span style="background:#ff9a3d">M</span><span style="background:#ff6a2b;color:#fff">F</span><span style="background:#f3e3d0">S</span>
            </div>
            <div>
              <span class="stars" id="heroStars"></span>
              <small data-i18n="hero.proof"></small>
            </div>
          </div>
        </div>

        <div class="hero-visual reveal reveal-d2">
          <div class="hero-frame"><img src="assets/img/mat.jpg" alt="Tepore Mat" fetchpriority="high"></div>
          <svg class="heatwaves" viewBox="0 0 200 120" aria-hidden="true">
            <defs><linearGradient id="hw" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a30"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></linearGradient></defs>
            <path d="M30 110c-12-18 12-30 0-50s12-32 0-52"/>
            <path d="M75 110c-12-18 12-30 0-50s12-32 0-52"/>
            <path d="M120 110c-12-18 12-30 0-50s12-32 0-52"/>
            <path d="M165 110c-12-18 12-30 0-50s12-32 0-52"/>
          </svg>
          <div class="temp-chip"><div><b>40°</b><small data-i18n="hero.chip"></small></div></div>
          <a href="product.html?p=pantofole-riscaldate" class="float-card fc-1">
            <img src="assets/img/slippers.jpg" alt="">
            <div><b>Tepore Slippers</b><small><span data-i18n="hero.fc1"></span> · <span class="price" data-price="tepore-slippers"></span></small></div>
          </a>
          <a href="product.html?p=scaldatazza-smart" class="float-card fc-2">
            <img src="assets/img/mug-warmer.jpg" alt="">
            <div><b>Tepore Cup</b><small><span data-i18n="hero.fc2"></span> · <span class="price" data-price="tepore-cup"></span></small></div>
          </a>
        </div>
      </div>
    </section>

    <!-- MARQUEE -->
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <!-- PRODOTTI -->
    <section class="section" id="prodotti">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="products.eyebrow"></span>
          <h2 data-i18n="products.title"></h2>
          <p data-i18n="products.lead"></p>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>
    </section>

    <!-- RITUALE -->
    <section class="section section-dark ritual grain" id="rituale">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="ritual.eyebrow"></span>
          <h2 data-i18n="ritual.title"></h2>
          <p data-i18n="ritual.lead"></p>
        </div>
        <div class="ritual-grid" id="ritualGrid"></div>
      </div>
    </section>

    <!-- TERMOSTATO INTERATTIVO -->
    <section class="section section-cream">
      <div class="container thermo">
        <div class="thermo-dial reveal" id="dial">
          <div class="thermo-readout"><b><span id="tempVal">45</span><sup>°C</sup></b><span id="tempLabel"></span></div>
        </div>
        <div class="thermo-controls reveal reveal-d1">
          <span class="eyebrow" data-i18n="thermo.eyebrow"></span>
          <h2 data-i18n="thermo.title"></h2>
          <p data-i18n="thermo.lead"></p>
          <input type="range" class="range" id="tempRange" min="35" max="65" value="45" step="1" data-i18n-attr="aria-label:a11y.temperature">
          <div class="range-labels"><span data-i18n="thermo.min"></span><span>50 °C</span><span data-i18n="thermo.max"></span></div>
          <ul class="thermo-match" id="thermoMatch"></ul>
        </div>
      </div>
    </section>

    <!-- BUNDLE -->
    <section class="section" id="kit">
      <div class="container">
        <div class="bundle reveal">
          <div class="bundle-visual">
            <img class="b-main" src="assets/img/mat.jpg" alt="">
            <img class="b-thumb b-t1" src="assets/img/slippers.jpg" alt="">
            <img class="b-thumb b-t2" src="assets/img/mug-warmer.jpg" alt="">
            <div class="bundle-stamp"><div><b id="bundlePct"></b><span data-i18n="bundle.stamp"></span></div></div>
          </div>
          <div class="bundle-body">
            <span class="eyebrow" data-i18n="bundle.eyebrow"></span>
            <h2 id="bundleName"></h2>
            <p data-i18n="bundle.lead"></p>
            <ul class="bundle-list" id="bundleList"></ul>
            <div class="bundle-price"><b id="bundlePrice"></b><s id="bundleCompare"></s><span class="price-save" id="bundleSave"></span></div>
            <div class="opt-label" style="color:#f1dfcf" data-i18n="bundle.size"></div>
            <div class="variants bundle-sizes" id="bundleSizes"></div>
            <button class="btn btn-primary btn-block" id="bundleAdd" data-i18n="bundle.add"></button>
            <p style="margin-top:14px;font-size:13.5px;color:#a8907c" data-i18n="bundle.note"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- BENEFICI -->
    <section class="section section-cream">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="benefits.eyebrow"></span>
          <h2 data-i18n="benefits.title"></h2>
        </div>
        <div class="benefits" id="benefits"></div>
      </div>
    </section>

    <!-- CONFRONTO -->
    <section class="section">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="compare.eyebrow"></span>
          <h2 data-i18n="compare.title"></h2>
          <p data-i18n="compare.lead"></p>
        </div>
        <div class="compare reveal">
          <table>
            <thead><tr><th></th><th class="us" data-i18n="compare.us"></th><th data-i18n="compare.them"></th></tr></thead>
            <tbody id="compareBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- RECENSIONI -->
    <section class="section section-cream" id="recensioni">
      <div class="container">
        <div class="section-head reveal">
          <span class="eyebrow" data-i18n="reviews.eyebrow"></span>
          <h2 data-i18n="reviews.title"></h2>
          <div class="reviews-summary"><span class="big" data-i18n="reviews.avg"></span><div><span id="sumStars"></span><div style="color:var(--muted);font-size:14px" data-i18n="reviews.sum"></div></div></div>
        </div>
        <div class="reviews-grid" id="reviewsGrid"></div>
        <p class="sample-note" id="sampleNote" hidden data-i18n="review.sampleNote"></p>
      </div>
    </section>

    <!-- NUMERI -->
    <section class="section section-dark grain" style="padding:clamp(60px,7vw,100px) 0">
      <div class="container stats">
        <div class="stat reveal"><b data-count="4500" data-suffix="+">4.500+</b><span data-i18n="stats.customers"></span></div>
        <div class="stat reveal reveal-d1"><b data-count="4.8">4,8</b><span data-i18n="stats.rating"></span></div>
        <div class="stat reveal reveal-d2"><b data-count="30" data-i18n-attr="data-suffix:stats.daysSuffix">30</b><span data-i18n="stats.returns"></span></div>
        <div class="stat reveal reveal-d3"><b data-count="60" data-suffix=" s">60 s</b><span data-i18n="stats.heat"></span></div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section" id="faq">
      <div class="container faq-wrap">
        <div class="section-head left reveal">
          <span class="eyebrow" data-i18n="faq.eyebrow"></span>
          <h2 data-i18n="faq.title"></h2>
          <p data-i18n="faq.lead"></p>
        </div>
        <div class="reveal reveal-d1" id="faqList"></div>
      </div>
    </section>

    <!-- GARANZIE -->
    <div class="container">
      <div class="trust-strip" id="trustStrip"></div>
    </div>

    <!-- NEWSLETTER -->
    <section class="section" style="padding-bottom:0">
      <div class="container">
        <div class="newsletter reveal" id="newsletter">
          <div>
            <h2 data-i18n="newsletter.title"></h2>
            <p data-i18n="newsletter.lead"></p>
          </div>
          <div>
            <form class="nl-form" id="nlForm">
              <input type="email" id="nlEmail" name="email" required data-i18n-attr="placeholder:newsletter.placeholder;aria-label:a11y.email">
              <button class="btn btn-dark" type="submit" data-i18n="newsletter.cta"></button>
            </form>
            <p class="nl-legal" data-i18n="newsletter.legal"></p>
            <div class="nl-success" id="nlOk"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-chrome-bottom></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n/it.js"></script>
  <script src="assets/js/i18n/en.js"></script>
  <script src="assets/js/i18n/de.js"></script>
  <script src="assets/js/i18n/fr.js"></script>
  <script src="assets/js/i18n/es.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>

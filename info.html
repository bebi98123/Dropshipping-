<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="meta.infoTitle">Assistenza, spedizioni e resi | Tepore</title>
  <meta name="description" data-i18n-attr="content:meta.infoDesc" content="Spedizioni, resi, garanzia, termini di vendita, privacy e contatti di Tepore.">
  <meta name="theme-color" content="#17120f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div data-chrome-top></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="info.eyebrow"></span>
        <h1 data-i18n="info.title"></h1>
        <p data-i18n="info.lead"></p>
        <nav class="tabs" id="tabs">
          <a href="#spedizioni" data-i18n="info.tabs.shipping"></a><a href="#resi" data-i18n="info.tabs.returns"></a><a href="#garanzia" data-i18n="info.tabs.warranty"></a>
          <a href="#termini" data-i18n="info.tabs.terms"></a><a href="#privacy" data-i18n="info.tabs.privacy"></a><a href="#contatti" data-i18n="info.tabs.contact"></a>
        </nav>
      </div>
    </section>

    <div class="container prose">
      <section id="spedizioni" data-i18n="info.shipping"></section>
      <section id="resi" data-i18n="info.returns"></section>
      <section id="garanzia" data-i18n="info.warranty"></section>
      <section id="termini" data-i18n="info.terms"></section>
      <section id="privacy" data-i18n="info.privacy"></section>

      <section id="contatti">
        <h2 data-i18n="info.contactTitle"></h2>
        <p data-i18n="info.contactLead"></p>
        <div class="contact-card">
          <div class="benefit"><div class="benefit-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></div><h3 data-i18n="info.emailCard"></h3><p><a id="contactEmail" class="text-link"></a></p></div>
          <div class="benefit"><div class="benefit-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div><h3 data-i18n="info.timeCard"></h3><p data-i18n="info.timeText"></p></div>
          <form id="contactForm">
            <div class="fields">
              <div class="field"><input id="cname" placeholder=" " required><label for="cname" data-i18n="info.formName"></label></div>
              <div class="field"><input id="cemail" type="email" placeholder=" " required><label for="cemail" data-i18n="info.formEmail"></label></div>
              <div class="field full"><input id="corder" placeholder=" "><label for="corder" data-i18n="info.formOrder"></label></div>
            </div>
            <textarea id="cmsg" required data-i18n-attr="placeholder:info.formMsg;aria-label:info.formMsg"></textarea>
            <button class="btn btn-primary" type="submit" data-i18n="info.formSend"></button>
            <p id="contactOk" hidden style="color:var(--green);font-weight:600" data-i18n="info.formOk"></p>
          </form>
        </div>
      </section>
    </div>
  </main>

  <div data-chrome-bottom></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n/it.js"></script>
  <script src="assets/js/i18n/en.js"></script>
  <script src="assets/js/i18n/de.js"></script>
  <script src="assets/js/i18n/fr.js"></script>
  <script src="assets/js/i18n/es.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("tepore:ready", function () {
      var S = window.STORE;
      var mail = document.getElementById("contactEmail");
      mail.textContent = S.email;
      mail.href = "mailto:" + S.email;
      var tabs = document.querySelectorAll("#tabs a");
      var mark = function () { tabs.forEach(function (a) { a.classList.toggle("active", a.getAttribute("href") === (location.hash || "#spedizioni")); }); };
      window.addEventListener("hashchange", mark); mark();
      document.getElementById("contactForm").addEventListener("submit", function (e) {
        e.preventDefault();
        // Collega qui un servizio form (Formspree, Netlify Forms, ecc.)
        document.getElementById("contactOk").hidden = false;
        e.target.reset();
      });
    });
  </script>
</body>
</html>
